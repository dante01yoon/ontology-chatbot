<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보험 데이터 챗봇</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --muted: #888; --accent: #2b6cb0; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 900px; padding: 10px 14px; border-radius: 10px; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; }
  .bot { align-self: flex-start; border: 1px solid var(--line); width: 100%; }
  .bot .meta { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .bot .answer { white-space: pre-wrap; }
  .bot .error { color: #c53030; }
  pre { background: #8881; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .table-wrap { overflow-x: auto; max-height: 320px; overflow-y: auto; }
  table { border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap; }
  th { background: #8881; position: sticky; top: 0; }
  .label { font-size: 12px; color: var(--muted); margin-top: 10px; }
  form { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }
  input { flex: 1; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
  button, select { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<header>
  <h1>보험 데이터 챗봇</h1>
  <label>모드
    <select id="mode">
      <option value="schema">schema — 스키마만</option>
      <option value="ontology">ontology — 스키마 + 온톨로지 + 매핑</option>
      <option value="guide">guide — 스키마 + 데이터 설명서</option>
      <option value="built">built — 스키마 + 직접 만든 온톨로지</option>
    </select>
  </label>
</header>
<main id="log"></main>
<form id="form">
  <input id="q" placeholder="예: 증권별 보험료 합계는?" autocomplete="off" autofocus>
  <button id="send">보내기</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function add(cls, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  $('log').append(div);
  div.scrollIntoView({ block: 'end' });
  return div;
}

function table(rows) {
  if (!rows.length) return '<div class="label">결과 없음 (0행)</div>';
  const cols = Object.keys(rows[0]);
  return `<div class="label">결과 ${rows.length}행</div><div class="table-wrap"><table>
    <tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr>
    ${rows.map((r) => `<tr>${cols.map((c) => `<td>${r[c] === null ? '<i>NULL</i>' : esc(r[c])}</td>`).join('')}</tr>`).join('')}
  </table></div>`;
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = $('q').value.trim();
  if (!question) return;
  const mode = $('mode').value;
  $('q').value = '';
  $('send').disabled = true;
  add('user', esc(question));
  const bot = add('bot', `<div class="meta">${esc(mode)} 모드 · 생각하는 중…</div>`);
  const t0 = performance.now();
  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question, mode }) });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error);
    const sec = ((performance.now() - t0) / 1000).toFixed(1);
    bot.innerHTML = `<div class="meta">${esc(mode)} 모드 · ${sec}초 · $${r.costUsd.toFixed(4)}</div>
      <div class="answer ${r.error ? 'error' : ''}">${esc(r.answer)}</div>
      <div class="label">SQL</div><pre>${esc(r.sql)}</pre>
      ${table(r.rows)}`;
  } catch (err) {
    bot.innerHTML = `<div class="meta">${esc(mode)} 모드</div><div class="answer error">오류: ${esc(err.message)}</div>`;
  } finally {
    $('send').disabled = false;
    $('q').focus();
  }
});
</script>
</body>
</html>
